<!DOCTYPE html>
<style>
    body {
        font-family: "Poppins", sans-serif;
    }

    .card {
        width:500px;
        height:350px;
        border-radius:15px;
        background-color:black;
        color:white;
        padding:10px;
    }

    button {
        width:250px;
        height:35px;
        border-radius: 15px;
        margin-top:10px;
        border:none;
        cursor:pointer;
    }

    input {
        width:250px;
        height:35px;
        border-radius: 15px;
        margin-top:10px;
        border:black 1px solid;
        cursor:pointer;
    }
</style>
<html>
    <head>
        <title>Neochat</title>
    </head>
    <body>
        <center>
            <section class="card">
                <h1>NeoChat 💬</h1>
                <input type="text" placeholder="Enter Room Code" id="roomcode">
                <input type="text" placeholder="Enter your Name" id="name">
                <section>
                    <button style="background-color:coral;" onclick="JoinChat()">Join Chatroom</button>
                    <p>Or</p>
                    <button onclick="CreateRoom()">Generate Chat 🔧</button>
                </section>
            </section>
            <h1>Neo Chat Updates</h1>
            <b>New UI Update!</b>
            <p>Changed the UI to a more minimalist and good looking UI. </p>
        </center>
    </body>
</html>
<script>
    function JoinChat() {
        localStorage.clear();
        localStorage.setItem("code", document.getElementById("roomcode").value);
        localStorage.setItem("name", document.getElementById("name").value);
        window.location.href=CheckPublicServer();
    }

    function CreateRoom() {
        const min = 100_000_000;  // 100 million
        const max = 999_999_999;  // 999,999,999
        code = Math.floor(Math.random() * (max - min + 1)) + min;

        document.getElementById("roomcode").value = code
    }

    function CheckPublicServer() {
        let code = document.getElementById("roomcode").value;
        if (code == "neochat.cc") {
            return "neohub.html";
        } else {
            return "chat.html"
        }
    }
</script>
