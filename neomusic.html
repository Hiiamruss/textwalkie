<!DOCTYPE html>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script> 
<style>
    body {
        font-family: "Poppins", sans-serif;
        background-color:aqua;
    }

    .card {
        width:500px;
        height:300px;
        border-radius:15px;
        background-color:black;
        color:white;
        padding:10px;
    }

    button {
        width:250px;
        height:35px;
        border-radius: 15px;
        margin-top:10px;
        border:none;
        cursor:pointer;
    }

    input {
        width:250px;
        height:35px;
        border-radius: 15px;
        margin-top:10px;
        border:black 1px solid;
        cursor:pointer;
    }

    div {
        width:400px;
        height:200px;
        border-radius:15px;
        background-color:coral;
        padding:10px;
        margin-top:20px;
    }
</style>
<html>
    <head>
        <title>Chat</title>
    </head>
    <body>
        <center>
            <h1>Wall Of Random Audios</h1>
            <p>The commands ran in this hub can only be seen by you. </p>
            <p>All Sounds here are submitted by NeoChat Team: elaboratescanner04</p>
            <audio src="audio/deltarune.mp3" controls></audio>
            <audio src="audio/canonind.mp3" controls></audio>
            <audio src="audio/entertainer.mp3" controls></audio>
            <audio src="audio/lofi.mp3" controls></audio>
            <audio src="audio/nocturne.mp3" controls id="meme"></audio>
            <audio src="audio/call-to-action-1.mp3" controls></audio>
            <audio src="audio/call-to-action-2.mp3" controls></audio>
            <audio src="audio/earrape.mp3" controls></audio>
            <audio src="audio/repulsive-audio.mp3" controls></audio>



            <section>
                 <input id="message" type="text" placeholder="Enter Command">
                 <button onclick="SendCommand()">Send Command (/neochat to go back to neochat)</button>
            </section>
        </center>
    </body>
</html>
<script>
    function SendCommand() {
        let sounds = document.querySelectorAll("audio");
        if (document.getElementById("message").value == "/neochat") {
            window.location.href = "index.html";
        } else if (document.getElementById("message").value == "/stopall") {
            window.location.href = "neomusic.html";
        } else if (document.getElementById("message").value == "/gamble") {
            let randomNumber = Math.floor(Math.random() * sounds.length);
            sounds[randomNumber].currentTime = 0;
            sounds[randomNumber].play();
        } else if (document.getElementById("message").value == "/everything") {
            sounds.forEach(sound => {
                sound.currentTime = 0;
                sound.play();
            });
        } else if (document.getElementById("message").value == "/meme") {
            document.getElementById("meme").play();
        }
        else {
            alert("Invalid command. Please try again.");
        }
    }
</script>
