<html>
    <head>
        <title>Chat</title>
    </head>
    <body>
        <center>
            <h1>NeoChat</h1>
            <b>Room Code: NeoChat AI 🤖</b>

            <section>
            <input id="message" type="text" placeholder="Enter Message">
            </section>

            <section>
                <button onclick="SendMessage()">Send Message</button>
                <button style="background-color: red;" onclick="window.location.href='index.html'">Disconnect</button>
            </section>

            <section id="messages">
                <div>
                    <b>NeoChat Robot</b>
                    <p>Hello! I am NeoBot! Ask me anything! (Im not verity btw)</p>
                </div>
            </section>
        </center>
    </body>

<script type="importmap">
      {
    "imports": {
      "openai": "https://cdn.jsdelivr.net/npm/openai@4/+esm"
    }
  }
</script>
<script type="module">
    import OpenAI from "openai"

    const firebaseConfig = {
        apiKey: "AIzaSyCa5IXdhKAWd9xb_pdWpdTGWnwyTHz1aNM",
        authDomain: "apikeys-9c946.firebaseapp.com",
        projectId: "apikeys-9c946",
        storageBucket: "apikeys-9c946.firebasestorage.app",
        messagingSenderId: "226994260057",
        appId: "1:226994260057:web:35c3ed5b52cca047b2c948"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const apikeyref = db.ref("apikey");
    let apikey;

    apikeyref.on("value", snap => {
        apikey = snap.val();
    }); 

    document.getElementById("message").addEventListener("keydown", )

    function SendMessage() {
        const openai = new OpenAI({
            apiKey: apikey,
            dangerouslyAllowBrowser: true,
        });

        openai.chat.completions.create({
        model: "gpt-4.1-nano",
        messages: [
            {role: "system", content: "You are a helpful chatbot agent that works for NeoChat. If anyone asks anything about neochat, here are some valuable informaation: Neochat is a chatting app which allows you to put a code and the other will need to put the same code in the chat so that the people can connect. There are special codes to like neohub.cc which allows u to run commands and view latest updates. The user can ask you any question, including soling mathematical equations and etc. Refrain from talking about sexual stuff and other innapropriate topics. Max 20 words"}, 
            {role: "user", content: document.getElementById("message").value}
        ]
        }).then(response => {
            const div = document.createElement("div");
            const b = document.createElement("b");
            const p = document.createElement("p");

            b.innerText = "NeoBot";
            p.innerText = response.choices[0].message.content;

            div.appendChild(b);
            div.appendChild(p);

            document.getElementById("messages").prepend(div);
            document.getElementById("message").value="";
        }
        ).catch(error => {
            const div = document.createElement("div");
            const b = document.createElement("b");
            const p = document.createElement("p");

            b.innerText = "NeoBot";
            p.innerText = error.message;

            div.appendChild(b);
            div.appendChild(p);

            document.getElementById("messages").prepend(div);
        });
    }
window.SendMessage = SendMessage;
    
</script>
